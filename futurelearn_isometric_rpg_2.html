<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibility Quest</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#17223c}#game{position:relative;width:100%;height:420px;overflow:hidden;background:#b7d4cc}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;left:10px;top:9px;background:#13233de9;color:white;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px;pointer-events:none}.hud b{font-size:15px}.hud small{display:block;color:#ff91d9;font-size:10px;font-weight:bold;letter-spacing:1px}.count{position:absolute;right:10px;top:9px;background:#13233de9;color:white;border-radius:8px;padding:9px;font-size:12px}.help{position:absolute;bottom:8px;left:8px;background:#13233de8;color:white;border-radius:8px;padding:7px 9px;font-size:11px;max-width:65%}.buttons{position:absolute;right:8px;bottom:8px;display:flex;gap:5px}.buttons button,.nav{border:1px solid #ffffff99;border-radius:7px;background:#182a48;color:white;padding:9px;font-weight:bold;cursor:pointer}.nav{position:absolute;right:9px;top:51px;font-size:11px}button:focus-visible{outline:3px solid #2541fc;outline-offset:2px}.overlay{position:absolute;inset:0;background:#0d1735cf;display:grid;place-items:center;padding:12px}.overlay[hidden]{display:none}.card{width:min(460px,100%);background:white;border-top:5px solid #de00a5;border-radius:13px;padding:15px 17px;color:#17233a;box-shadow:0 14px 35px #0005;max-height:100%;overflow:auto}.card h2{margin:3px 0 7px;font-size:21px}.card p{font-size:13px;line-height:1.4;margin:6px 0 9px}.card small{font-size:10px;color:#a00079;letter-spacing:1px;font-weight:800}.choice{display:block;width:100%;background:#f6f7fd;color:#17233a;border:1px solid #c5cce0;border-radius:7px;padding:9px;text-align:left;margin:5px 0;font-size:12px;cursor:pointer}.choice[aria-pressed=true]{border:2px solid #2541fc;background:#e9edff}.primary{border:0;background:#de00a5;color:white;border-radius:7px;padding:10px 13px;font-weight:bold;cursor:pointer;margin-top:7px}.primary:disabled{opacity:.5}.status{font-size:12px;font-weight:bold;margin-top:7px;min-height:15px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:400px){.hud b{font-size:12px}.count{font-size:10px}.help{font-size:10px}.buttons button{padding:7px}.card{padding:10px}.card h2{font-size:18px}.choice{padding:7px;font-size:11px}}</style></head><body><main id="game"><canvas id="scene" aria-label="Isometric village with three learning stations and an exit gate. Use the accessible locations menu to navigate without the map."></canvas><div class="hud"><small>ACCESSIBILITY QUEST</small><b>The Village of Access</b></div><div class="count" id="count">QUESTS 0 / 3</div><button class="nav" id="locations">Accessible locations</button><div class="help" id="help">Move with arrow keys / WASD or tap the map. Reach glowing signs and press Enter or tap them.</div><div class="buttons"><button id="up" aria-label="Move north">▲</button><button id="left" aria-label="Move west">◀</button><button id="down" aria-label="Move south">▼</button><button id="right" aria-label="Move east">▶</button></div><div class="overlay" id="overlay"><div class="card" id="card"></div></div></main><script>(()=>{const $=x=>document.getElementById(x),canvas=$('scene'),c=canvas.getContext('2d');const N=9,M=9;const objects=[{x:2,y:2,title:'The Market Sign',emoji:'◐',question:'The market sign has pale text on a pale background. Which improvement helps?',answers:['Increase the contrast between text and background','Use only colour to convey the message','Add more decorative icons'],correct:0,explain:'Readable contrast helps more people understand important information.'},{x:6,y:2,title:'The Village Form',emoji:'▤',question:'A form field has no label. What is the best solution?',answers:['Put the instructions in a separate document','Add a persistent label linked to the field','Only use placeholder text'],correct:1,explain:'Persistent, associated labels support clarity and assistive technologies.'},{x:2,y:6,title:'The Library Door',emoji:'⇥',question:'The library menu cannot be operated using a keyboard. What should change?',answers:['Make the menu animate faster','Ask visitors to use a mouse','Support keyboard access and visible focus'],correct:2,explain:'People must be able to operate essential controls using a keyboard.'},{x:6,y:6,title:'The Village Gate',emoji:'★',gate:true}];let hero={x:4,y:4},visual={x:4,y:4},facing=1,walking=false,target=null,done=new Set(),active=-1,chosen=-1,mode='intro',t=0,view={cx:0,cy:0,tw:50,th:25};function modal(html){$('card').innerHTML=html;$('overlay').hidden=false;let b=$('card').querySelector('button');if(b)b.focus()}function close(){mode='play';$('overlay').hidden=true;$('locations').focus()}function intro(){mode='intro';modal('<small>AN ISOMETRIC MINI RPG</small><h2>Welcome, adventurer!</h2><p>Explore the village and help residents remove three accessibility barriers. Each successful decision restores part of the village.</p><p>Move with <b>arrow keys / WASD</b> or click a tile. Visit glowing stations and press <b>Enter</b>, or use <b>Accessible locations</b> for direct keyboard navigation.</p><button class="primary" id="start">Start exploring</button>');$('start').onclick=close}function loc(){mode='locations';modal('<small>MAP ALTERNATIVE</small><h2>Choose a location</h2><p>These controls provide the same challenges without navigating the visual map.</p><div id="list"></div><button class="primary" id="back">Return to village</button>');objects.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=o.title+(done.has(i)?' (completed)':'');b.onclick=()=>interact(i);$('list').append(b)});$('back').onclick=close}function interact(i){const o=objects[i];if(o.gate){if(done.size===3){mode='win';modal('<small>QUEST COMPLETE</small><h2>Village restored! ✨</h2><p>You helped remove three digital barriers. Accessible design requires listening to disabled people and testing real services, but these choices are a useful starting point.</p><button class="primary" id="again">Play again</button>');$('again').onclick=()=>{done.clear();hero={x:4,y:4};visual={x:4,y:4};$('count').textContent='QUESTS 0 / 3';close()}}else{$('help').textContent='The gate is locked. Complete all three village quests first.'}return}if(done.has(i)){$('help').textContent=o.title+' is already restored.';return}active=i;chosen=-1;mode='quiz';modal('<small>VILLAGE QUEST '+(i+1)+'</small><h2>'+o.title+'</h2><p>'+o.question+'</p><div id="answers"></div><button class="primary" id="check" disabled>Choose solution</button><div class="status" id="status" role="status" aria-live="polite"></div>');o.answers.forEach((a,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=a;b.setAttribute('aria-pressed','false');b.onclick=()=>{chosen=j;[...$('answers').children].forEach((e,k)=>e.setAttribute('aria-pressed',String(j===k)));$('check').disabled=false;$('status').textContent=''};$('answers').append(b)});$('check').onclick=()=>{if(chosen===o.correct){done.add(i);$('count').textContent='QUESTS '+done.size+' / 3';$('status').textContent='Quest complete! '+o.explain;$('status').style.color='#12623e';$('check').textContent='Back to village';$('check').onclick=close}else{$('status').textContent='Not quite. Try another solution.';$('status').style.color='#9b2033'}}}function iso(x,y){return {x:view.cx+(x-y)*view.tw/2,y:view.cy+(x+y)*view.th/2}}function poly(points,fill,stroke){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}function box(x,y,z,w,h,d,front,top,side){let p=iso(x,y),a={x:p.x-w/2,y:p.y-z},b={x:p.x+w/2,y:p.y-z},cc={x:p.x+w/2+d,y:p.y-z-d/2},dd={x:p.x-w/2+d,y:p.y-z-d/2};poly([a,b,{x:b.x,y:b.y+h},{x:a.x,y:a.y+h}],front);poly([b,cc,{x:cc.x,y:cc.y+h},{x:b.x,y:b.y+h}],side);poly([a,b,cc,dd],top)}function draw(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr)}let w=canvas.width,h=canvas.height;c.setTransform(dpr,0,0,dpr,0,0);w/=dpr;h/=dpr;view.tw=Math.min(w/9.5,53);view.th=view.tw*.51;view.cx=w/2;view.cy=h*.14;c.clearRect(0,0,w,h);let sky=c.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#92bdc5');sky.addColorStop(1,'#d9e8d6');c.fillStyle=sky;c.fillRect(0,0,w,h);for(let yy=0;yy<N;yy++)for(let xx=0;xx<M;xx++){let p=iso(xx,yy),a={x:p.x,y:p.y},b={x:p.x+view.tw/2,y:p.y+view.th/2},cc={x:p.x,y:p.y+view.th},dd={x:p.x-view.tw/2,y:p.y+view.th/2};let path=xx===4||yy===4||xx===6&&yy>3?'#d6c8ac':(xx+yy)%2?'#78b28b':'#81bb90';poly([a,b,cc,dd],path,'#ffffff20');if((xx*7+yy*11)%17===0&&!objects.some(o=>o.x===xx&&o.y===yy)){c.fillStyle='#346f58';c.beginPath();c.arc(p.x,p.y+view.th*.4,2.5,0,Math.PI*2);c.fill()}}let sprites=[...objects.map((o,i)=>({...o,i,type:'object'})),{...hero,type:'hero'}];sprites.sort((a,b)=>(a.x+a.y)-(b.x+b.y));sprites.forEach(o=>{let p=iso(o.type==='hero'?visual.x:o.x,o.type==='hero'?visual.y:o.y),cx=p.x,cy=p.y+view.th*.45;if(o.type==='hero'){
const phase=t/95, swing=walking?Math.sin(phase)*5:0, bounce=walking?Math.abs(Math.sin(phase))*3:Math.sin(t/600)*.7;
c.fillStyle='#26374c55';c.beginPath();c.ellipse(cx,cy,11,5,0,0,Math.PI*2);c.fill();
// Animated legs, arms, body and head. No external assets needed.
c.save();c.translate(cx,cy-bounce);
c.strokeStyle='#243b71';c.lineWidth=5;c.lineCap='round';
c.beginPath();c.moveTo(-4,-12);c.lineTo(-5+swing,-2);c.moveTo(4,-12);c.lineTo(5-swing,-2);c.stroke();
c.fillStyle='#2541fc';c.beginPath();c.roundRect(-8,-29,16,20,4);c.fill();
c.strokeStyle='#e3a77e';c.lineWidth=4;c.beginPath();c.moveTo(-8,-25);c.lineTo(-11-swing*.6,-14);c.moveTo(8,-25);c.lineTo(11+swing*.6,-14);c.stroke();
c.fillStyle='#f1c99c';c.beginPath();c.arc(0,-36,9,0,Math.PI*2);c.fill();
c.fillStyle='#24304c';c.beginPath();c.arc(0,-39,9,Math.PI,Math.PI*2);c.fill();
c.fillStyle='#26334d';c.fillRect(facing<0?-5:2,-36,2,2);c.restore();
}else if(o.gate){box(o.x,o.y,23,31,30,8,'#46516b','#ff9dcf','#293b5b');c.fillStyle='#fff';c.font='bold 15px Arial';c.textAlign='center';c.fillText(done.size===3?'★':'🔒',cx,cy-27)}else{let solved=done.has(o.i);box(o.x,o.y,18,27,28,7,solved?'#348b70':'#5c6387',solved?'#8ee9bd':'#f7ca6c','#343c65');c.fillStyle=solved?'#b5ffdb':'#fff0aa';c.font='bold 17px Arial';c.textAlign='center';c.fillText(solved?'✓':o.emoji,cx,cy-23);c.strokeStyle=solved?'#80ffbd':'#ffdb76';c.lineWidth=2;c.beginPath();c.ellipse(cx,cy,16+Math.sin(t/350)*2,6,0,0,Math.PI*2);c.stroke()}});const dx=hero.x-visual.x,dy=hero.y-visual.y;visual.x+=dx*.14;visual.y+=dy*.14;walking=Math.hypot(dx,dy)>.045;t+=16;requestAnimationFrame(draw)}function step(dx,dy){if(mode!=='play')return;if(dx!==0)facing=dx;hero.x=Math.max(0,Math.min(8,hero.x+dx));hero.y=Math.max(0,Math.min(8,hero.y+dy));let o=objects.findIndex(o=>Math.abs(o.x-hero.x)+Math.abs(o.y-hero.y)<=1);if(o>=0){$('help').textContent='Near '+objects[o].title+'. Press Enter or tap its sign to interact.';target=o}else{$('help').textContent='Explore the village. Find three glowing signs and the gate.';target=null}}window.addEventListener('keydown',e=>{if(mode!=='play')return;const key=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','enter',' '].includes(key))e.preventDefault();if(key==='arrowup'||key==='w')step(0,-1);if(key==='arrowdown'||key==='s')step(0,1);if(key==='arrowleft'||key==='a')step(-1,0);if(key==='arrowright'||key==='d')step(1,0);if((key==='enter'||key===' ')&&target!==null)interact(target)});[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(([id,dx,dy])=>$(id).onclick=()=>step(dx,dy));$('locations').onclick=loc;canvas.addEventListener('click',e=>{if(mode!=='play')return;const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let nearest=objects.map((o,i)=>({i,d:Math.hypot(iso(o.x,o.y).x-mx,iso(o.x,o.y).y+view.th*.45-23-my)})).sort((a,b)=>a.d-b.d)[0];if(nearest.d<27){interact(nearest.i);return}let tx=(mx-view.cx)/(view.tw/2),ty=(my-view.cy-view.th*.5)/(view.th/2);hero.x=Math.max(0,Math.min(8,Math.round((tx+ty)/2)));hero.y=Math.max(0,Math.min(8,Math.round((ty-tx)/2)));target=null});intro();requestAnimationFrame(draw)})();</script></body></html>
